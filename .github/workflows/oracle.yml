name: reference-input-gate
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  gate:
    name: Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Preserve committed source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: 788c0ff15a1da140e447058405edc86245f5cd9a
      - uses: actions/download-artifact@v4
        with:
          run-id: 43879188618
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Commit-Will/redivivus
          pattern: oracle-*
          path: oracle-results
      - name: Replay latest gate against fresh native evidence
        shell: pwsh
        run: |
          $gateHead = (& git rev-parse HEAD).Trim()
          if ($gateHead -ne '788c0ff15a1da140e447058405edc86245f5cd9a') { throw 'Unexpected gate revision' }
          $gate = Join-Path $env:GITHUB_WORKSPACE 'asm_matching/msvc8/scripts/oracle-parity.ps1'
          $report = & $gate -Artifacts ./oracle-results | ConvertFrom-Json
          if ($report.candidateCommit -ne '812d9e025f61b6ed98f8fb7a573973376457c298') { throw 'Unexpected measured source revision' }
          if ($report.mainControlCommit -ne 'dc838217637f0152df1752722b796181179a74c3') { throw 'Unexpected independent261 control revision' }
          $report | ConvertTo-Json -Depth 6 | Set-Content oracle-gate-replay.json -Encoding utf8
          [ordered]@{
            gateCommit = $gateHead
            measuredCandidateCommit = $report.candidateCommit
            independent261LinuxControlCommit = $report.mainControlCommit
            measuredRun = 43879188618
            scope = 'Replay of fresh measured artifacts; native oracle code unchanged by gate-only follow-up'
          } | ConvertTo-Json | Set-Content gate-provenance.json -Encoding utf8
      - name: Reject changed or missing candidate reference-input provenance
        shell: pwsh
        run: |
          $gate = Join-Path $env:GITHUB_WORKSPACE 'asm_matching/msvc8/scripts/oracle-parity.ps1'
          $fixtureRoot = Join-Path $env:GITHUB_WORKSPACE 'gate-fixtures'
          New-Item -ItemType Directory -Path $fixtureRoot | Out-Null
          $results = @()
          foreach ($caseName in @('different-reference-evidence', 'missing-reference-input')) {
            $fixture = Join-Path $fixtureRoot $caseName
            Copy-Item -LiteralPath ./oracle-results -Destination $fixture -Recurse
            $inputFile = Join-Path $fixture 'oracle-windows-candidate/oracle-inputs.json'
            $inputs = Get-Content -LiteralPath $inputFile -Raw | ConvertFrom-Json -AsHashtable
            if ($caseName -eq 'different-reference-evidence') { $inputs.confirmedStarts = 'b' * 64 }
            else { $inputs.Remove('confirmedStarts') }
            [IO.File]::WriteAllText($inputFile, ($inputs | ConvertTo-Json) + "`n", [Text.UTF8Encoding]::new($false))
            $start = [Diagnostics.ProcessStartInfo]::new()
            $start.FileName = (Get-Command pwsh).Source
            $start.UseShellExecute = $false
            $start.CreateNoWindow = $true
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            foreach ($arg in @('-NoProfile', '-File', $gate, '-Artifacts', $fixture)) { $start.ArgumentList.Add($arg) }
            $process = [Diagnostics.Process]::Start($start)
            $stdout = $process.StandardOutput.ReadToEnd()
            $stderr = $process.StandardError.ReadToEnd()
            $process.WaitForExit()
            [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE "$caseName.log"), $stdout + $stderr, [Text.UTF8Encoding]::new($false))
            if ($process.ExitCode -eq 0) { throw "Gate accepted $caseName" }
            $results += [ordered]@{ case = $caseName; rejected = $true; exitCode = $process.ExitCode; syntheticMetadataOnly = $true }
          }
          $results | ConvertTo-Json | Set-Content gate-negative-cases.json -Encoding utf8
      - name: Retain replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-input-gate-${{ runner.os }}
          path: |
            gate-provenance.json
            oracle-gate-replay.json
            gate-negative-cases.json
            different-reference-evidence.log
            missing-reference-input.log
          if-no-files-found: warn
