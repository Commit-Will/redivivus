name: generator-ready-review-integration-packages
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  GHIDRA_TEST_CXX: none
jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Preserve committed source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          repository: Commit-Will/ghidra-reconstruct
          ref: 0e78e3975dd70022ffcfceffa934d0bd242da567
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Make Git Bash available to Windows fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
      - name: Record the exact generator source
        shell: pwsh
        run: |
          $sourceHead = (& git rev-parse HEAD).Trim()
          if ($sourceHead -ne '0e78e3975dd70022ffcfceffa934d0bd242da567') { throw 'Unexpected generator revision' }
          [ordered]@{
            repository = 'Commit-Will/ghidra-reconstruct'
            sourceHead = $sourceHead
            node = (& node --version).Trim()
            pnpm = (& pnpm --version).Trim()
            compilerTests = $env:GHIDRA_TEST_CXX
            lockSHA256 = (Get-FileHash pnpm-lock.yaml -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content validation-provenance.json -Encoding utf8
      - name: Install frozen dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile 2>&1 | Tee-Object install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build all packages
        shell: pwsh
        run: |
          pnpm build 2>&1 | Tee-Object build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check postdec and join behavior with the Linux host compiler
        if: runner.os == 'Linux'
        shell: pwsh
        env:
          GHIDRA_TEST_CXX: host
        run: |
          node --import tsx --test --test-reporter=tap packages/cpp-parser/src/transform/plugins/__tests__/vc8-form-postdec.test.ts packages/cpp-parser/src/transform/plugins/__tests__/vc8-form-postdec-native.test.ts packages/reconstruct/src/__tests__/vc8-postdec-codegen.test.ts packages/cpp-parser/src/transform/plugins/__tests__/vc8-form-join.test.ts 2>&1 | Tee-Object native.tap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the complete existing package and script suites
        shell: pwsh
        run: |
          node --import tsx --test --test-reporter=tap --test-concurrency=8 'packages/*/src/**/*.test.ts' 'scripts/**/*.test.ts' 2>&1 | Tee-Object package.tap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain logs and source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generator-ready-review-integration-${{ runner.os }}
          path: |
            validation-provenance.json
            install.log
            build.log
            package.tap
            native.tap
          if-no-files-found: warn
