name: generator-old-review-packages
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  GHIDRA_TEST_CXX: none
jobs:
  package:
    name: Package (PR${{ matrix.review }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - review: 14
            os: ubuntu-latest
            generatorHead: c9bf902f3d41d4ed024b547ceec170829e597a29
          - review: 68
            os: ubuntu-latest
            generatorHead: 6a5d592a1dc7055bb24430e976c54f81db3a2f97
          - review: 75
            os: ubuntu-latest
            generatorHead: d3b3f3d679aa7927d052ef426c7a23032c94fccd
    steps:
      - name: Preserve committed source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          repository: Commit-Will/ghidra-reconstruct
          ref: ${{ matrix.generatorHead }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Make Git Bash available to Windows fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
      - name: Record the exact generator source
        shell: pwsh
        run: |
          $sourceHead = (& git rev-parse HEAD).Trim()
          if ($sourceHead -ne '${{ matrix.generatorHead }}') { throw 'Unexpected generator revision' }
          [ordered]@{
            repository = 'Commit-Will/ghidra-reconstruct'
            sourceHead = $sourceHead
            node = (& node --version).Trim()
            pnpm = (& pnpm --version).Trim()
            compilerTests = $env:GHIDRA_TEST_CXX
            lockSHA256 = (Get-FileHash pnpm-lock.yaml -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content validation-provenance.json -Encoding utf8
      - name: Install frozen dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile 2>&1 | Tee-Object install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build all packages
        shell: pwsh
        run: |
          pnpm build 2>&1 | Tee-Object build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the complete existing package suite
        shell: pwsh
        run: |
          node --import tsx --test --test-reporter=tap --test-concurrency=8 'packages/*/src/**/*.test.ts' 2>&1 | Tee-Object package.tap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain logs and source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generator-review-pr${{ matrix.review }}-Linux
          path: |
            validation-provenance.json
            install.log
            build.log
            package.tap
          if-no-files-found: warn
