name: oracle-cache-path-probe
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  VC8_TOOLCHAIN: ${{ github.workspace }}/../vc8-toolchain-cache-path-probe
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve the toolchain cache path with the proposed step
        id: toolchain-cache-path
        shell: bash
        run: |
          toolchain_cache_path=$(realpath -m "$VC8_TOOLCHAIN")
          printf 'path=%s\n' "$toolchain_cache_path" >> "$GITHUB_OUTPUT"
      - name: Create a harmless cache payload
        shell: bash
        run: |
          mkdir -p "$VC8_TOOLCHAIN"
          printf 'oracle-cache-path-probe\n' > "$VC8_TOOLCHAIN/cache-path-probe.txt"
      - uses: actions/cache/save@v4
        with:
          path: ${{ steps.toolchain-cache-path.outputs.path }}
          key: oracle-cache-path-probe-${{ github.run_id }}
      - name: Remove only the probe payload before restore
        shell: bash
        run: rm -- "$VC8_TOOLCHAIN/cache-path-probe.txt"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.toolchain-cache-path.outputs.path }}
          key: oracle-cache-path-probe-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Check the restored payload
        shell: bash
        run: |
          test "$(cat "$VC8_TOOLCHAIN/cache-path-probe.txt")" = oracle-cache-path-probe
          printf 'Normalized cache saved, restored and verified: %s\n' "$VC8_TOOLCHAIN"
