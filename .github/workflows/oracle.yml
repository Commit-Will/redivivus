name: generator-precount-packages
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  GHIDRA_TEST_CXX: none
jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Preserve committed source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          repository: Commit-Will/ghidra-reconstruct
          ref: ed2745f02b5e599c30ee6a413d46535e9c97c8fe
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Make Git Bash available to Windows fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
      - name: Record the exact generator source
        shell: pwsh
        run: |
          $sourceHead = (& git rev-parse HEAD).Trim()
          if ($sourceHead -ne 'ed2745f02b5e599c30ee6a413d46535e9c97c8fe') { throw 'Unexpected generator revision' }
          [ordered]@{
            repository = 'Commit-Will/ghidra-reconstruct'
            sourceHead = $sourceHead
            node = (& node --version).Trim()
            pnpm = (& pnpm --version).Trim()
            compilerTests = $env:GHIDRA_TEST_CXX
            excludedBaselineAssertion = 'discovers a generic field address with languageId and no architecture property (unchanged main; corrected separately by PR92)'
            lockSHA256 = (Get-FileHash pnpm-lock.yaml -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content validation-provenance.json -Encoding utf8
      - name: Install frozen dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile 2>&1 | Tee-Object install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build all packages
        shell: pwsh
        run: |
          pnpm build 2>&1 | Tee-Object build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check precount and its real producer with the Linux host compiler
        if: runner.os == 'Linux'
        shell: pwsh
        env:
          GHIDRA_TEST_CXX: host
        run: |
          node --import tsx --test --test-reporter=tap packages/cpp-parser/src/transform/plugins/__tests__/vc8-form-precount.test.ts packages/cpp-parser/src/transform/plugins/__tests__/vc8-form-precount-native.test.ts packages/reconstruct/src/codegen/non-null-field-getters.test.ts packages/reconstruct/src/__tests__/vc8-precount-codegen.test.ts scripts/vc8form-permute/candidates-precount.test.ts 2>&1 | Tee-Object native.tap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run all packages and scripts with the reproduced baseline assertion excluded
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          node --import tsx --test --test-reporter=tap --test-concurrency=8 --test-skip-pattern 'discovers a generic field address with languageId and no architecture property' 'packages/*/src/**/*.test.ts' 'scripts/**/*.test.ts' 2>&1 | Tee-Object package.tap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the focused Windows producer, form, codegen and discovery checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node --import tsx --test --test-reporter=tap packages/cpp-parser/src/transform/plugins/__tests__/vc8-form-precount.test.ts packages/cpp-parser/src/transform/plugins/__tests__/vc8-form-precount-native.test.ts packages/reconstruct/src/codegen/non-null-field-getters.test.ts packages/reconstruct/src/__tests__/vc8-precount-codegen.test.ts scripts/vc8form-permute/candidates-precount.test.ts 2>&1 | Tee-Object focused.tap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain logs and source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generator-precount-${{ runner.os }}
          path: |
            validation-provenance.json
            install.log
            build.log
            package.tap
            native.tap
            focused.tap
          if-no-files-found: warn
