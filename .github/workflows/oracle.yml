name: generator-remaining-draft-packages
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  GHIDRA_TEST_CXX: none
jobs:
  package:
    name: Package (PR${{ matrix.review }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - review: 78
            os: ubuntu-latest
            generatorHead: 6dea69ff2d7e222cf166efccf6df14cbaf75e1bb
          - review: 79
            os: ubuntu-latest
            generatorHead: 7f5a23c9cf5c8f004a96a8d122906d50d25692e5
          - review: 80
            os: ubuntu-latest
            generatorHead: 361463f57a38e195b87a81c3225e14acc8dff15f
          - review: 81
            os: ubuntu-latest
            generatorHead: d5063db21e80c99b70cda5963fbbc8f7085696ae
          - review: 82
            os: ubuntu-latest
            generatorHead: 8bbb3dcd0f79cce77b0154f7b9a6cfd6892096ec
          - review: 83
            os: ubuntu-latest
            generatorHead: af7d2c29c1323c8b6acd8c71c26428400c18d791
          - review: 84
            os: ubuntu-latest
            generatorHead: aec588a102a571788a4d581f5f31887f3d9abfc7
          - review: 86
            os: ubuntu-latest
            generatorHead: d24d1e8cd69c7c72bab98e5da27390eb6ec951e5
    steps:
      - name: Preserve committed source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          repository: Commit-Will/ghidra-reconstruct
          ref: ${{ matrix.generatorHead }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Make Git Bash available to Windows fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
      - name: Record the exact generator source
        shell: pwsh
        run: |
          $sourceHead = (& git rev-parse HEAD).Trim()
          if ($sourceHead -ne '${{ matrix.generatorHead }}') { throw 'Unexpected generator revision' }
          [ordered]@{
            repository = 'Commit-Will/ghidra-reconstruct'
            sourceHead = $sourceHead
            node = (& node --version).Trim()
            pnpm = (& pnpm --version).Trim()
            compilerTests = $env:GHIDRA_TEST_CXX
            lockSHA256 = (Get-FileHash pnpm-lock.yaml -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content validation-provenance.json -Encoding utf8
      - name: Install frozen dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile 2>&1 | Tee-Object install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build all packages
        shell: pwsh
        run: |
          pnpm build 2>&1 | Tee-Object build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the complete existing package suite
        shell: pwsh
        run: |
          node --import tsx --test --test-reporter=tap --test-concurrency=8 'packages/*/src/**/*.test.ts' 2>&1 | Tee-Object package.tap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain logs and source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generator-review-pr${{ matrix.review }}-Linux
          path: |
            validation-provenance.json
            install.log
            build.log
            package.tap
          if-no-files-found: warn
